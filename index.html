<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href=
    "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    
   
</head>
<body>

    <div class="container">

        <div class="image">
                 <h1 id="h1">Welcome to our Community!</h1>
                 <br>
                 <br>
                 <br>
                 <br>
                 <br>
                 <img src="https://docs.simplecheckoutbuilder.com/wp-content/uploads/2024/04/pana.svg" alt="">
        </div>

        <form>
                <h1>Create Account</h1>
                <p>Sign Up to your account below.</p>
                <br>
                <br>

            <div class="Names">

                <div class="Name1">
                     <label for="FirstName">First Name </label>
                     <br>
                     <input type="name" id="FirstName" placeholder="|">
                </div>

                <div class="Name2">
                      <label for="LastName">Last Name</label>
                      <br>
                      <input type="name" id="LastName" placeholder="|">
                </div>

            </div>

                 <br>
                 <br>
                 <label for="emailaddress">Email Address</label>
                 <br>
                 <br>
                 <input type="email" id="email" placeholder="|">
                 <br>
                 <br>
                 <label for="password">Password</label>
                 <br>

           <div class="input-wrapper">

                 <input type="password" id="password" placeholder="|">

                 <button class="toggle-password" onclick="togglePasswordVisibility()">
                 <i id="toggleIcon" class="fas fa-eye"></i>

                </button>

           </div>    
                 <br>
                 <br>
                 <label for="password">Confirm Password</label>
                 <br>

          <div class="input-wrapper">

                 <input type="password" id="password" placeholder="|">

                 <button class="toggle-password" onclick="togglePasswordVisibility()">
                 <i id="toggleIcon" class="fas fa-eye"></i>

                 </button>
          </div>
                 <br>
                 <br>
                 <br>
                 <button type="button" id="button">Create Account</button>
                 <br>
                 <br>
                 <p id="Account">Already have an account? <b id="SignIn">Sign In</b>  </p>
                 <br>
                 <h3 class="h3">or</h3>
                 <br><br>
            <div class="cons">
                <img src="https://img.icons8.com/?size=512&id=17949&format=png" id="google">
                <img src="https://banner2.cleanpng.com/20180324/xuw/kisspng-social-media-computer-icons-facebook-squeegee-wind-facebook-5ab6eae0d1acd4.6346716915219371208588.jpg" id="facebook">
                <img src="https://pngimg.com/d/apple_logo_PNG19666.png" id="apple">
           </div>
                 <br>
                
                
         </form>



    </div>
    
</body>
</html>
